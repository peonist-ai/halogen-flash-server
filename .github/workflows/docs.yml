name: docs

# GitHub Pages now only redirects to https://peonist.ai/halogen/docs/,
# which the site workflow publishes.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "llms.txt"
      - "mkdocs.yml"
      - "tools/check_docs.py"
      - "tools/docs_redirects.py"
      - "tools/check_redirects.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: python tools/check_docs.py
      - run: mkdocs build --strict
      - run: python tools/docs_redirects.py site pages
      - run: python tools/check_redirects.py --local site pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
